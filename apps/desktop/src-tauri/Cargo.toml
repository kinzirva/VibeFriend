[package]
name = "vibefriend"
default-run = "vibefriend"
version = "0.2.0"
description = "Private, local-first activity tracker"
authors = ["VibeFriend contributors"]
edition = "2021"

[lib]
name = "vibefriend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The Tauri MockRuntime test feature currently prevents Windows Server 2025
# cargo test binaries from starting (STATUS_ENTRYPOINT_NOT_FOUND). Keep it
# scoped to macOS; Windows still runs all production store/collector tests.
tauri = { version = "2", features = ["test"] }
