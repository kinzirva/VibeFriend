name: Cross-platform desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows NSIS
            os: windows-2025
            bundle: nsis
            artifact: VibeFriend-Windows
            path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS DMG
            os: macos-15
            bundle: dmg
            artifact: VibeFriend-macOS
            path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm install

      - name: Typecheck and build shared web UI
        run: |
          npm run typecheck
          npm run test:csv
          npm run build:web

      - name: Verify web output
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/web/dist/index.html
          test -d apps/web/dist/assets

      - name: Generate application icons
        run: npm run icon --workspace @vibefriend/desktop

      - name: Rust unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build desktop installer
        run: npm run tauri --workspace @vibefriend/desktop -- build --bundles ${{ matrix.bundle }}

      - name: Verify installer exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(${{ matrix.path }})
          test "${#files[@]}" -eq 1
          test -s "${files[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  native-windows-ipc:
    name: Windows native WebView2 to Tauri IPC smoke
    needs: desktop
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JavaScript test dependencies
        run: npm install

      - uses: actions/download-artifact@v4
        with:
          name: VibeFriend-Windows
          path: native-release

      - name: Install and test actual Windows GUI to native IPC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem native-release -Filter '*x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS artifact missing' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          $app = @(
            (Join-Path $env:LOCALAPPDATA 'ActivityTracker/vibefriend.exe'),
            (Join-Path $env:LOCALAPPDATA 'ActivityTracker/ActivityTracker.exe'),
            (Join-Path $env:LOCALAPPDATA 'VibeFriend/vibefriend.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) { throw 'Installed desktop executable missing' }
          # WebView2 Runtime 150 ignores WEBVIEW2_* env overrides in elevated hosts.
          # CI-only HKLM policy is honored by elevated WebView2; remove it in finally.
          # https://github.com/MicrosoftEdge/WebView2Feedback/issues/5645
          $debugPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $exeName = [IO.Path]::GetFileName($app)
          New-Item -Path $debugPolicy -Force | Out-Null
          New-ItemProperty -Path $debugPolicy -Name $exeName -PropertyType String -Value '--remote-debugging-port=9222' -Force | Out-Null
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          Write-Host "Runner identity: $(whoami)"
          Write-Host "PowerShell session ID: $((Get-Process -Id $PID).SessionId)"
          Write-Host "Executable: $app"
          Write-Host "WebView2 loopback CDP enabled for this ephemeral CI process only (HKLM policy: $exeName)"
          $process = $null
          try {
            $process = Start-Process -FilePath $app -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            Write-Host "Desktop process PID=$($process.Id) session=$($process.SessionId) exited=$($process.HasExited)"
            if ($process.HasExited) {
              throw "Desktop executable exited before WebView2 CDP became available (exit code $($process.ExitCode))"
            }
            node apps/web/e2e/native-windows-ipc.mjs
            if ($LASTEXITCODE -ne 0) { throw "Native WebView2 IPC smoke failed: $LASTEXITCODE" }
            node apps/web/e2e/native-windows-collector.mjs
            if ($LASTEXITCODE -ne 0) { throw "Installed Windows real-collector GUI/SQLite smoke failed: $LASTEXITCODE" }
            # Run LAST: this deliberately locks the ephemeral Windows session.
            # It requires a real Win32 desktop transition and production SQLite
            # no-growth evidence. Never substitute pure eligibility unit tests.
            node apps/web/e2e/native-windows-lock.mjs
            if ($LASTEXITCODE -ne 0) { throw "Real Windows OS lock/SQLite P0 probe failed: $LASTEXITCODE" }
          } finally {
            Write-Host "Windows native GUI diagnostics:"
            try {
              Get-Process | Where-Object { $_.ProcessName -match 'vibefriend|activitytracker|msedge|webview' } |
                Select-Object ProcessName, Id, SessionId, HasExited |
                Format-Table -AutoSize | Out-String | Write-Host
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'vibefriend|activitytracker|msedgewebview' } |
                Select-Object Name, ProcessId, SessionId, ParentProcessId, CommandLine |
                Format-List | Out-String | Write-Host
              Get-NetTCPConnection -LocalPort 9222 -ErrorAction SilentlyContinue |
                Select-Object LocalAddress, LocalPort, State, OwningProcess |
                Format-Table -AutoSize | Out-String | Write-Host
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -MaxEvents 100 -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting' -or $_.Message -match 'vibefriend|ActivityTracker|WebView2' } |
                Select-Object -First 8 TimeCreated, ProviderName, Id, Message |
                Format-List | Out-String | Write-Host
            } catch {
              Write-Host "Diagnostic collection error: $_"
            }
            if ($process) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Remove-ItemProperty -Path $debugPolicy -Name $exeName -ErrorAction SilentlyContinue
          }

  prerelease:
    name: Publish verified CI installers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Do not publish installers unless BOTH real installed OS GUI/IPC smoke jobs pass.
    # The macOS gate must not be a merely informational job.
    needs: [desktop, native-windows-ipc, native-macos-gui-probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Download ONLY the two installer artifacts. Native GUI diagnostics are
      # also named VibeFriend-* and must never become release assets.
      - uses: actions/download-artifact@v4
        with:
          name: VibeFriend-Windows
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: VibeFriend-macOS
          path: release

      - name: Verify release payloads
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t exe_files < <(find release -maxdepth 2 -type f -name '*.exe')
          mapfile -t dmg_files < <(find release -maxdepth 2 -type f -name '*.dmg')
          test "${#exe_files[@]}" -eq 1
          test "${#dmg_files[@]}" -eq 1
          exe="${exe_files[0]}"
          dmg="${dmg_files[0]}"
          test "$(stat -c%s "$exe")" -gt 1000000
          test "$(stat -c%s "$dmg")" -gt 1000000
          python3 - "$exe" "$dmg" <<'PY'
          from pathlib import Path
          import sys

          exe = Path(sys.argv[1])
          dmg = Path(sys.argv[2])
          assert exe.read_bytes()[:2] == b"MZ", "Windows installer is not a PE executable"
          trailer = dmg.read_bytes()[-512:]
          assert b"koly" in trailer, "macOS DMG is missing the UDIF trailer"
          print(f"verified {exe.name}: {exe.stat().st_size} bytes")
          print(f"verified {dmg.name}: {dmg.stat().st_size} bytes")
          PY
          (
            cd release
            # Publish portable basenames so sha256sum -c works beside downloads.
            sha256sum "$(basename "$exe")" "$(basename "$dmg")" | tee SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.0-alpha.${{ github.run_number }}
        run: |
          gh release create "$TAG" release/*.exe release/*.dmg release/SHA256SUMS.txt             --target "$GITHUB_SHA"             --prerelease             --title "ActivityTracker $TAG"             --notes "Automated unsigned cross-platform preview. Windows and macOS installers passed CI build, unit tests, payload validation and SHA256 generation. Public signed distribution is a later milestone."

      - name: Verify published prerelease by downloading GitHub assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.0-alpha.${{ github.run_number }}
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          gh release download "$TAG" --dir "$verify_dir" \
            --pattern '*.exe' --pattern '*.dmg' --pattern 'SHA256SUMS.txt'
          test "$(find "$verify_dir" -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$verify_dir" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          test -s "$verify_dir/SHA256SUMS.txt"
          diff -u release/SHA256SUMS.txt "$verify_dir/SHA256SUMS.txt"
          (cd "$verify_dir" && sha256sum --check SHA256SUMS.txt)
          echo "GitHub Release $TAG: downloaded EXE, DMG and manifest; hashes verified"


  native-macos-gui-probe:
    name: macOS installed WKWebView GUI/IPC P0 smoke
    needs: desktop
    runs-on: macos-15
    timeout-minutes: 20
    # This is a required hosted-VM functional check: real installed WKWebView
    # AXPress -> production Tauri IPC -> TextEdit sampling in SQLite -> Pause.
    # Do not treat this as physical-Mac acceptance or code signing.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VibeFriend-macOS
          path: native-release

      - name: Exercise installed macOS GUI, native IPC and real foreground SQLite
        shell: bash
        run: bash scripts/macos-native-gui-smoke.sh

      - name: Probe installed macOS WKWebView CSV export and reconcile downloaded file
        shell: bash
        run: bash scripts/macos-native-csv-smoke.sh

      - name: Upload native macOS CSV diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VibeFriend-macOS-native-csv-log
          path: ${{ runner.temp }}/macos-native-csv.log
          if-no-files-found: ignore

      - name: Verify macOS real restart persistence and default-off consent
        shell: bash
        run: bash scripts/macos-native-restart-smoke.sh

      - name: Upload native macOS restart diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VibeFriend-macOS-native-restart-log
          path: ${{ runner.temp }}/macos-native-restart.log
          if-no-files-found: ignore

      - name: Upload native macOS GUI diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VibeFriend-macOS-native-gui-probe-log
          path: ${{ runner.temp }}/macos-native-gui.log
          if-no-files-found: ignore
