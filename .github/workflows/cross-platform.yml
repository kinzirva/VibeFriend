name: Cross-platform desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows NSIS
            os: windows-2025
            bundle: nsis
            artifact: VibeFriend-Windows
            path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS DMG
            os: macos-15
            bundle: dmg
            artifact: VibeFriend-macOS
            path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm install

      - name: Typecheck and build shared web UI
        run: |
          npm run typecheck
          npm run test:csv
          npm run build:web

      - name: Verify web output
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/web/dist/index.html
          test -d apps/web/dist/assets

      - name: Generate application icons
        run: npm run icon --workspace @vibefriend/desktop

      - name: Rust unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build desktop installer
        run: npm run tauri --workspace @vibefriend/desktop -- build --bundles ${{ matrix.bundle }}

      - name: Verify installer exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(${{ matrix.path }})
          test "${#files[@]}" -eq 1
          test -s "${files[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  prerelease:
    name: Publish verified CI installers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: VibeFriend-*
          path: release
          merge-multiple: true

      - name: Verify release payloads
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t exe_files < <(find release -maxdepth 2 -type f -name '*.exe')
          mapfile -t dmg_files < <(find release -maxdepth 2 -type f -name '*.dmg')
          test "${#exe_files[@]}" -eq 1
          test "${#dmg_files[@]}" -eq 1
          exe="${exe_files[0]}"
          dmg="${dmg_files[0]}"
          test "$(stat -c%s "$exe")" -gt 1000000
          test "$(stat -c%s "$dmg")" -gt 1000000
          python3 - "$exe" "$dmg" <<'PY'
          from pathlib import Path
          import sys

          exe = Path(sys.argv[1])
          dmg = Path(sys.argv[2])
          assert exe.read_bytes()[:2] == b"MZ", "Windows installer is not a PE executable"
          trailer = dmg.read_bytes()[-512:]
          assert b"koly" in trailer, "macOS DMG is missing the UDIF trailer"
          print(f"verified {exe.name}: {exe.stat().st_size} bytes")
          print(f"verified {dmg.name}: {dmg.stat().st_size} bytes")
          PY
          (
            cd release
            # Publish portable basenames so sha256sum -c works beside downloads.
            sha256sum "$(basename "$exe")" "$(basename "$dmg")" | tee SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.0-alpha.${{ github.run_number }}
        run: |
          gh release create "$TAG" release/*             --target "$GITHUB_SHA"             --prerelease             --title "VibeFriend $TAG"             --notes "Automated unsigned cross-platform preview. Windows and macOS installers passed CI build, unit tests, payload validation and SHA256 generation. Public signed distribution is a later milestone."
