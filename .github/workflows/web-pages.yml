name: Web dashboard

on:
  push:
    branches: [main, feat/cross-platform-v0.2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A PR build must never cancel the main branch's Pages deployment.
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:csv
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: VibeFriend-Web
          path: apps/web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/download-artifact@v4
        with:
          name: VibeFriend-Web
          path: apps/web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact deployed Pages HTML and assets over HTTPS
        # A successful deploy action alone does not prove the public URL serves
        # this commit. Check the actual remote index and immutable Vite assets.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import re
          import time
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          root = Path("apps/web/dist")
          expected_html = (root / "index.html").read_text(encoding="utf-8")
          refs = re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"', expected_html)
          assert refs and any(ref.endswith(".js") for ref in refs), "No built JS asset in index.html"
          page_url = __import__("os").environ["PAGE_URL"]
          assert page_url.startswith("https://"), f"Not an HTTPS Pages URL: {page_url}"
          print(f"Checking public Pages URL: {page_url}")
          print(f"Expected immutable assets: {refs}")

          def fetch(url):
              request = Request(url, headers={"User-Agent": "ActivityTracker-Pages-Smoke/1.0", "Cache-Control": "no-cache"})
              with urlopen(request, timeout=20) as response:
                  assert response.status == 200, f"{url} returned {response.status}"
                  return response.read()

          for attempt in range(1, 19):
              try:
                  remote_html = fetch(page_url).decode("utf-8")
                  assert '<div id="root">' in remote_html, "Missing React mount point"
                  for ref in refs:
                      assert ref in remote_html, f"Live index is not yet the current build: {ref}"
                      local = root / "assets" / Path(ref).name
                      assert local.is_file(), f"Missing local asset: {local}"
                      remote_bytes = fetch(urljoin(page_url, ref))
                      assert hashlib.sha256(remote_bytes).digest() == hashlib.sha256(local.read_bytes()).digest(), f"Asset differs from deployed build: {ref}"
                  print(f"PASS: public Pages HTML and {len(refs)} JS/CSS assets match this exact build")
                  break
              except Exception as exc:
                  if attempt == 18:
                      raise
                  print(f"Pages propagation check {attempt}/18: {exc}; retrying in 10s", flush=True)
                  time.sleep(10)
          PY

      # Asset identity is not sufficient: exercise the real HTTPS app in
      # Chromium, including browser-only privacy and CSV lifecycle.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install live-browser smoke dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Exercise actual public Pages UI in Chromium
        working-directory: apps/web
        env:
          LIVE_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test e2e/live-pages.spec.ts
      - name: Upload failed live Pages browser trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-browser-trace
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
