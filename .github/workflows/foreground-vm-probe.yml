name: Foreground collector VM probe

on:
  pull_request:
    paths:
      - apps/desktop/src-tauri/src/collector.rs
      - apps/desktop/src-tauri/src/bin/foreground_probe.rs
      - apps/desktop/src-tauri/src/bin/sampling_probe.rs
      - apps/desktop/src-tauri/src/bin/transition_probe.rs
      - .github/workflows/foreground-vm-probe.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/src/collector.rs
      - apps/desktop/src-tauri/src/bin/foreground_probe.rs
      - apps/desktop/src-tauri/src/bin/sampling_probe.rs
      - apps/desktop/src-tauri/src/bin/transition_probe.rs
      - .github/workflows/foreground-vm-probe.yml

permissions:
  contents: read

jobs:
  windows-foreground:
    name: Windows foreground fixture (Notepad)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Tauri icons for diagnostic build
        run: |
          npm install
          npm run icon --workspace @vibefriend/desktop
          npm run build:web
      - name: Compile VM diagnostic binaries before foreground activation
        working-directory: apps/desktop/src-tauri
        run: cargo build --bin foreground_probe --bin sampling_probe --bin transition_probe
      - name: Launch and foreground Notepad
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proc = Start-Process notepad.exe -PassThru
          Start-Sleep -Seconds 3
          $proc.Refresh()
          if ($proc.HasExited) { throw "Notepad exited unexpectedly" }
          $activated = (New-Object -ComObject WScript.Shell).AppActivate($proc.Id)
          if (-not $activated) { throw "Unable to foreground Notepad: VM may lack an interactive desktop" }
          # Generate a harmless F15 input event so the OS idle gate is active.
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SendKeys]::SendWait('{F15}')
          Start-Sleep -Seconds 2
      - name: Verify production Windows foreground detector
        working-directory: apps/desktop/src-tauri
        run: cargo run --bin foreground_probe -- notepad
      - name: Verify real Windows collector samples, pauses and SQLite lifecycle
        working-directory: apps/desktop/src-tauri
        run: cargo run --bin sampling_probe -- notepad
      - name: Reactivate Notepad and reset OS idle before two-app switch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proc = Get-Process notepad | Select-Object -First 1
          if (-not $proc) { throw "Notepad fixture no longer running" }
          if (-not (New-Object -ComObject WScript.Shell).AppActivate($proc.Id)) { throw "Notepad reactivation failed" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SendKeys]::SendWait('{F15}')
      - name: Verify real Windows Notepad to Task Manager transition and SQLite attribution
        working-directory: apps/desktop/src-tauri
        run: cargo run --bin transition_probe -- notepad Taskmgr

  macos-foreground:
    name: macOS foreground fixture (TextEdit)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Tauri icons for diagnostic build
        run: |
          npm install
          npm run icon --workspace @vibefriend/desktop
          npm run build:web
      - name: Compile VM diagnostic binaries before foreground activation
        working-directory: apps/desktop/src-tauri
        run: cargo build --bin foreground_probe --bin sampling_probe --bin transition_probe
      - name: Launch and foreground TextEdit
        run: |
          set -euo pipefail
          open -a TextEdit
          sleep 3
          # Activation is best effort: the foreground probe itself must pass.
          osascript -e 'tell application "TextEdit" to activate' || true
          # F15 is a harmless synthetic input for the production idle gate.
          osascript -e 'tell application "System Events" to key code 113' || true
      - name: Verify production macOS NSWorkspace detector
        working-directory: apps/desktop/src-tauri
        run: cargo run --bin foreground_probe -- TextEdit
      - name: Verify real macOS collector samples, pauses and SQLite lifecycle
        working-directory: apps/desktop/src-tauri
        run: cargo run --bin sampling_probe -- TextEdit
      - name: Reactivate TextEdit and reset OS idle before two-app switch
        run: |
          set -euo pipefail
          osascript -e 'tell application "TextEdit" to activate'
          osascript -e 'tell application "System Events" to key code 113' || true
      - name: Verify real macOS TextEdit to Calculator transition and SQLite attribution
        working-directory: apps/desktop/src-tauri
        run: cargo run --bin transition_probe -- TextEdit Calculator
