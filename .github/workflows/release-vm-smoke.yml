name: Release VM smoke

on:
  release:
    types: [published]
  # Releases created with GITHUB_TOKEN do not emit a new release workflow event.
  # The publishing workflow itself DOES emit workflow_run on completion.
  workflow_run:
    workflows: [Cross-platform desktop]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Do not smoke the previous 'latest' Release on a workflow-file push.
  # Only an actual published Release or completed publisher may assert a build.

permissions:
  contents: read

jobs:
  resolve-release:
    # A release may already have been published even if the publisher's final
    # verification step failed. Always inspect completed main push runs.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          PUBLISH_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          PUBLISH_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PUBLISH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_TAG:-}" ]; then
            tag="$EVENT_TAG"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            # The tag is derived from the EXACT completed build, never 'latest'.
            tag="v0.2.0-alpha.${PUBLISH_RUN_NUMBER}"
          else
            # The GitHub releases API may place an older release first (e.g.
            # alpha.96 ahead of alpha.161). Never assume list order is recency.
            # Manual dispatch must smoke the most recently PUBLISHED release.
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .published_at != null)] | max_by(.published_at) | .tag_name')"
          fi
          test -n "$tag"
          test "$tag" != "null"
          # A failed publishing run may have failed BEFORE creating its release
          # (skip), or AFTER creating it (still smoke-test that release).
          # Allow for GitHub API propagation; never fall back to "latest".
          max_attempts=12
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "$PUBLISH_CONCLUSION" != "success" ]; then
            max_attempts=4
          fi
          found=false
          for attempt in $(seq 1 "$max_attempts"); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              found=true
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then sleep 10; fi
          done
          if [ "$found" != true ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "$PUBLISH_CONCLUSION" != "success" ]; then
              echo "::notice::No published release for unsuccessful publisher run; skipping smoke"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Published release $tag not found after retries"
            exit 1
          fi
          # A successful SHA256/install smoke for the wrong commit is not
          # acceptance of this publisher run. Reject stale/mis-targeted tags.
          # Our publisher creates the release with --target "$GITHUB_SHA".
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            release_sha="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            if [ "$release_sha" != "$PUBLISH_HEAD_SHA" ]; then
              echo "::error::Release $tag target $release_sha does not match publisher head $PUBLISH_HEAD_SHA"
              exit 1
            fi
            echo "PASS: release target SHA matches exact publisher head $PUBLISH_HEAD_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Testing published release: $tag"

  windows-smoke:
    name: Windows installer + launch smoke
    needs: resolve-release
    if: needs.resolve-release.outputs.published == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Download published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir release --pattern "*x64-setup.exe" --pattern "SHA256SUMS.txt"
          Get-ChildItem release | Format-Table Name, Length

      - name: Verify Windows installer SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "*x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          $sumLine = Get-Content release/SHA256SUMS.txt | Where-Object { $_ -match [regex]::Escape($installer.Name) } | Select-Object -First 1
          if (-not $sumLine) { throw "No SHA256 entry for $($installer.Name)" }
          $expected = ($sumLine -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "expected=$expected"
          Write-Host "actual=$actual"
          if ($actual -ne $expected) { throw "SHA256 mismatch" }

      - name: Silent install
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release -Filter "*x64-setup.exe" | Select-Object -First 1).FullName
          $proc = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installer exit code $($proc.ExitCode)" }

      - name: Locate and launch installed app
        shell: pwsh
        run: |
          $roots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ -and (Test-Path $_) }
          $app = $null
          # Tauri productName can change independently of the Cargo binary name.
          foreach ($root in $roots) {
            foreach ($name in @("ActivityTracker.exe", "VibeFriend.exe")) {
              $app = Get-ChildItem -Path $root -Filter $name -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($app) { break }
            }
            if ($app) { break }
          }
          if (-not $app) { throw "Installed ActivityTracker/VibeFriend executable not found" }
          Write-Host "Launching $($app.FullName)"
          $proc = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) { throw "$($app.Name) exited early with code $($proc.ExitCode)" }
          Write-Host "$($app.Name) stayed alive for 10 seconds (PID $($proc.Id))"
          Stop-Process -Id $proc.Id -Force

  macos-smoke:
    name: macOS DMG + launch smoke
    needs: resolve-release
    if: needs.resolve-release.outputs.published == 'true'
    runs-on: macos-15
    # Hosted macOS runner provisioning occasionally consumes the original 15m
    # without executing a single step; retain strict hash/install/launch checks.
    timeout-minutes: 30
    steps:
      - name: Download published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern "*aarch64.dmg" --pattern "SHA256SUMS.txt"
          ls -lh release

      - name: Verify macOS installer SHA256
        run: |
          set -euo pipefail
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          expected="$(grep "  $(basename "$dmg")$" release/SHA256SUMS.txt | awk '{print $1}')"
          actual="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Mount DMG and launch app
        run: |
          set -euo pipefail
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          attach_output="$(hdiutil attach "$dmg" -nobrowse -readonly)"
          echo "$attach_output"
          mount_point="$(echo "$attach_output" | awk '/\/Volumes\// {sub(/^.*\t/,""); print; exit}')"
          test -d "$mount_point"
          # Bundle display name may change; launch the executable declared by Info.plist.
          app="$(find "$mount_point" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app"
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$app" "$RUNNER_TEMP/Applications/"
          installed="$RUNNER_TEMP/Applications/$(basename "$app")"
          bin_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$installed/Contents/Info.plist")"
          test -n "$bin_name"
          bin="$installed/Contents/MacOS/$bin_name"
          test -x "$bin"
          xattr -dr com.apple.quarantine "$installed" 2>/dev/null || true
          echo "Launching $bin"
          "$bin" >"$RUNNER_TEMP/vibefriend-macos.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/vibefriend-macos.log" || true
            exit 1
          fi
          echo "$(basename "$installed") stayed alive for 10 seconds (PID $pid)"
          kill "$pid" || true
          wait "$pid" || true
          hdiutil detach "$mount_point" || true

      - name: Upload macOS launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VibeFriend-macOS-smoke-log
          path: ${{ runner.temp }}/vibefriend-macos.log
          if-no-files-found: ignore
