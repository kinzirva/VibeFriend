name: One-shot manual Release smoke regression

# This temporary gate runs only for the merge commit that introduces it.
# It exercises the actual workflow_dispatch branch, which is distinct from
# the existing automatic workflow_run path.
on:
  workflow_run:
    workflows: [Cross-platform desktop]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-manual-release-smoke:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, 'ci(P0): verify manual release selector once')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise real workflow_dispatch latest-published-release path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Publisher run: ${{ github.event.workflow_run.html_url }}"
          gh workflow run release-vm-smoke.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched real Release VM smoke via workflow_dispatch."
          echo "The dispatched run's resolver and Windows/macOS jobs must still be inspected separately."
