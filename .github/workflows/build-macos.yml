name: macOS build and release
on:
  push:
    branches: [main, feat/weft-macos-app]
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Build app
        run: |
          swift build -c release
          mkdir -p dist/VibeFriend.app/Contents/MacOS
          cp .build/release/VibeFriend dist/VibeFriend.app/Contents/MacOS/VibeFriend
          cat > dist/VibeFriend.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>VibeFriend</string>
          <key>CFBundleIdentifier</key><string>com.vibefriend.app</string>
          <key>CFBundleName</key><string>VibeFriend</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.1.0</string>
          <key>LSMinimumSystemVersion</key><string>14.0</string>
          </dict></plist>
          PLIST
          hdiutil create -volname VibeFriend -srcfolder dist/VibeFriend.app -ov -format UDZO dist/VibeFriend-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: VibeFriend-macOS-unsigned
          path: dist/VibeFriend-unsigned.dmg
      - name: Publish prerelease (unsigned)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/VibeFriend-unsigned.dmg --prerelease --title "VibeFriend ${GITHUB_REF_NAME} (unsigned)"
